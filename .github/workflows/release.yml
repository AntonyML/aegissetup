name: release

# F1 + F2: construye el EXE de Windows con el runtime legado embebido y lo
# publica como asset del Release cuando se empuja un tag v*.
#
# El paso "Verificar runtime embebido" corre ANTES del build a propósito: si los
# .dll de Crystal no están versionados, el embed se arma incompleto y el Release
# publicaría un EXE que no sirve en una PC limpia. El test corta el pipeline.
#
# F7d: además del EXE se publica el respaldo .bak (asset aparte, ~39 MB). No viaja
# dentro del EXE y Aegis no lo descarga: el operador lo baja a mano del Release y
# "aegis bak" le dice la URL y la carpeta donde dejarlo.
#
# OJO con las rutas: este workflow vive en el repo de AegisSetup, así que la raíz del
# workspace ES el directorio del módulo. Los pasos corren desde ahí y NINGÚN path lleva
# el prefijo "AegisSetup/" (ese prefijo solo tendría sentido si el workflow viviera en el
# repo padre, que ni siquiera tiene .github/). Con el prefijo puesto, el primer paso que
# corre falla y el Release no se publica.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verificar runtime embebido
        run: go test ./assets/...

      # F7d: el respaldo no viaja dentro del EXE, así que se publica como asset aparte.
      # El nombre del asset es FIJO (SIDC_2014.bak) aunque el archivo del repo lleve la
      # fecha en el nombre: "aegis bak" imprime .../releases/latest/download/SIDC_2014.bak
      # y esa URL tiene que seguir siendo válida en el próximo release. Corre antes del
      # build para que un .bak sin versionar corte el pipeline en segundos, no al final.
      - name: Preparar el respaldo del Release
        shell: pwsh
        run: |
          $baks = @(Get-ChildItem assets/backups/sqlserver2014/*.bak)
          if ($baks.Count -ne 1) {
            throw "esperaba exactamente 1 .bak versionado en assets/backups/sqlserver2014, encontré $($baks.Count)"
          }
          Copy-Item $baks[0].FullName SIDC_2014.bak
          "{0} -> {1:N1} MB" -f $baks[0].Name, ($baks[0].Length / 1MB)

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o aegis.exe ./cmd/aegis

      - name: Reportar tamaño del binario
        shell: pwsh
        run: |
          $exe = Get-Item aegis.exe
          "{0} -> {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aegis.exe
            SIDC_2014.bak
          generate_release_notes: true
