name: Build and Release Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build, Package & Release
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📐 Calcular Próxima Versión Semántica
        id: semver
        shell: pwsh
        run: |
          $exactTag = (git tag --points-at HEAD) | Where-Object { $_ -match "^v\d" } | Select-Object -First 1
          if ($exactTag) {
            $version = $exactTag.TrimStart('v')
            $versionTag = $exactTag
          } else {
            $latestTag = (git tag -l "v*" --sort=-v:refname) | Select-Object -First 1
            if (-not $latestTag) {
              $version = "1.0.0"
            } else {
              $clean = $latestTag.TrimStart('v')
              $parts = $clean.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2]

              $commits = git log "$latestTag..HEAD" --oneline
              $isMajor = $false
              $isMinor = $false
              $hasCommits = $false

              foreach ($c in $commits) {
                if (-not [string]::IsNullOrWhiteSpace($c)) {
                  $hasCommits = $true
                  if ($c -match "(?i)BREAKING CHANGE|breaking:") {
                    $isMajor = $true
                  } elseif ($c -match "(?i)feat(\([^\)]+\))?:") {
                    $isMinor = $true
                  }
                }
              }

              if ($isMajor) {
                $major++
                $minor = 0
                $patch = 0
              } elseif ($isMinor) {
                $minor++
                $patch = 0
              } elseif ($hasCommits) {
                $patch++
              }
              $version = "$major.$minor.$patch"
            }
            $versionTag = "v$version"
          }
          Write-Host "✅ Versión calculada: $version (Tag: $versionTag)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_tag=$versionTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 🔧 Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 🧪 Verificar runtime embebido
        run: go test ./assets/...

      - name: 🔍 Vet
        run: go vet ./...

      - name: 🧪 Tests
        run: go test ./... -count=1

      - name: 🐧 Comprobar compilación Linux
        shell: pwsh
        run: |
          $env:GOOS = "linux"
          go build ./...
          Remove-Item Env:GOOS

      - name: 🏗️ Compilar Binario Go con Versión Inyectada
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          $ver = "${{ steps.semver.outputs.version }}"
          Write-Host "Compilando Aegis Setup versión $ver..."
          go build -v -trimpath -ldflags="-s -w -X aegis-setup/internal/version.Current=$ver" -o bin/aegis.exe ./cmd/aegis

      - name: 🖥️ Compilar ReportHost x86
        shell: pwsh
        run: ./reporthost/build.ps1

      - name: 🛠️ Instalar Inno Setup
        run: choco install innosetup --no-progress

      - name: 📦 Compilar Instalador con Inno Setup
        shell: pwsh
        run: |
          $iscc = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { "iscc.exe" }
          $ver = "${{ steps.semver.outputs.version }}"
          Write-Host "Compilando instalador Inno Setup con versión $ver..."
          & $iscc /O+ /DMyAppVersion=$ver installer.iss

      - name: 📊 Reportar tamaño de artefactos
        shell: pwsh
        run: |
          Get-ChildItem -Path bin/aegis.exe, dist/*.exe | ForEach-Object {
            "{0} -> {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: 📤 Subir Artefactos al Run
        uses: actions/upload-artifact@v4
        with:
          name: AegisSetup-v${{ steps.semver.outputs.version }}-Windows
          path: |
            dist/*.exe
            bin/aegis.exe
            bin/Aegis.ReportHost.exe
          retention-days: 30

      - name: 🚀 Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.version_tag }}
          name: Release ${{ steps.semver.outputs.version_tag }}
          body: |
            ## 📦 Artefactos Oficiales de Aegis Setup (SIDC)

            | Archivo | Tipo | Descripción |
            | :--- | :--- | :--- |
            | **`AegisSetup-Setup-v${{ steps.semver.outputs.version }}.exe`** | **Instalador Oficial (Inno Setup)** | **Recomendado para Terminales y Servidores.** Asistente guiado de instalación, accesos directos en Menú de Inicio y Escritorio, registro COM/OCX y desinstalador limpio. |
            | **`aegis.exe`** | **Binario Portable (CLI / TUI)** | Ejecutable puro sin instalación. Ideal para tareas automatizadas, CI/CD o ejecución directa desde terminal. |

            Los ejecutables de SIDC generados por esta versión se nombran
            `Sistema Intergrado de Controles y Presupuesto_AegisSetup.exe` y,
            para Docker, `Sistema Intergrado de Controles y Presupuesto_Docker_AegisSetup_v${{ steps.semver.outputs.version }}.exe`.

            ---
            *Desarrollado para FEMUCARIBE · Costa Rica.*
          files: |
            dist/*.exe
            bin/aegis.exe
            bin/Aegis.ReportHost.exe
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
